<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>뷰티디자인과 면접 답변 정리</title>
<style>
:root{--bg:#f7f5f3;--paper:#fff;--ink:#27252b;--muted:#716b73;--accent:#a65d78;--line:#e9e1e5;--soft:#fbf0f4}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family: "Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif;line-height:1.85}.wrap{max-width:1080px;margin:auto;padding:40px 24px 100px}header{background:linear-gradient(125deg,#4d3444,#9c627b);color:#fff;padding:52px 48px;border-radius:24px}header .eyebrow{font-size:13px;letter-spacing:.15em;opacity:.8}h1{font-size:clamp(28px,4vw,42px);line-height:1.3;margin:13px 0}header p{opacity:.9;margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.toolbar input{flex:1;min-width:210px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;font:inherit;background:white}.toolbar button,.filters button,.copy{border:1px solid var(--line);border-radius:11px;padding:10px 15px;background:#fff;color:var(--ink);cursor:pointer;font:inherit;font-size:14px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.filters button.active{background:var(--accent);color:white;border-color:var(--accent)}.count{font-size:13px;color:var(--muted);margin-bottom:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:17px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 5px 18px #3c233009;display:flex;flex-direction:column;gap:12px}.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.number{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.1em}.tag{background:var(--soft);color:#97536f;font-size:12px;padding:3px 10px;border-radius:99px}.card h2{font-size:18px;line-height:1.45;margin:0}.answer{margin:0;font-size:15px;white-space:pre-line;flex:1;word-break:keep-all}.copy{align-self:flex-end;padding:6px 12px;color:var(--accent)}.empty{text-align:center;padding:60px;color:var(--muted)}footer{text-align:center;margin-top:36px;color:var(--muted);font-size:12px}@media(max-width:740px){.wrap{padding:15px 14px 60px}header{padding:35px 26px}.cards{grid-template-columns:1fr}.card{padding:21px}}@media print{body{background:#fff}.wrap{max-width:none;padding:0}header{color:#222;background:none;border-bottom:2px solid #ccc;border-radius:0;padding:0 0 20px}.toolbar,.filters,.copy,.count,footer{display:none!important}.cards{display:block}.card{break-inside:avoid;box-shadow:none;border:1px solid #ddd;margin:12px 0;padding:15px}.answer{font-size:12px}h1{font-size:25px}}

/* 확대 읽기 모드 */
.card{cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card:hover{transform:translateY(-3px);border-color:#cfa6b7;box-shadow:0 12px 28px #3c23301a}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card::after{content:'눌러서 크게 읽기 ↗';font-size:12px;color:var(--accent);align-self:flex-start}
.reader-overlay[hidden]{display:none!important}
.reader-overlay{position:fixed;inset:0;z-index:1000;background:#211923b8;display:flex;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(5px);animation:fadeIn .18s ease}
.reader-panel{width:min(100%,790px);max-height:min(90dvh,900px);background:white;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 90px #120b1655;animation:popIn .22s ease}
.reader-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 25px;border-bottom:1px solid var(--line)}
.reader-head .reader-label{font-size:13px;font-weight:700;color:var(--accent)}
.reader-close,.reader-actions button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;cursor:pointer;font:inherit;color:var(--ink)}
.reader-close{font-size:20px;line-height:1}
.reader-content{overflow-y:auto;overscroll-behavior:contain;padding:25px 34px 34px}
.reader-content h2{font-size:clamp(22px,4vw,30px);line-height:1.45;margin:0 0 24px;word-break:keep-all}
.reader-answer{font-size:var(--reader-size,21px);line-height:2.05;white-space:pre-line;word-break:keep-all;margin:0}
.reader-actions{padding:15px 25px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);background:#fdfafb}
.reader-actions .reader-grow{flex:1}
.reader-actions button:disabled{opacity:.35;cursor:not-allowed}
.reader-actions .reader-primary{background:var(--accent);border-color:var(--accent);color:#fff}
body.reader-open{overflow:hidden}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes popIn{from{transform:translateY(12px) scale(.98);opacity:.6}to{transform:translateY(0) scale(1);opacity:1}}
@media(max-width:740px){.reader-overlay{padding:0;align-items:flex-end}.reader-panel{width:100%;max-height:94dvh;border-radius:22px 22px 0 0}.reader-head{padding:13px 18px}.reader-content{padding:24px 22px 35px}.reader-answer{line-height:1.95}.reader-actions{padding:12px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom))}.reader-actions button{padding:10px 12px}.card::after{content:'터치해서 크게 읽기 ↗'}}
@media(prefers-reduced-motion:reduce){.reader-overlay,.reader-panel{animation:none}.card{transition:none}}
@media print{.reader-overlay{display:none!important}.card::after{display:none}}
</style>
</head>
<body><main class="wrap"><header><div class="eyebrow">INTERVIEW PREPARATION · 15 ANSWERS</div><h1>뷰티디자인과 면접 답변 노트</h1><p>경험 · 가치관 · 전공 적합성 · 상황 대처를 한눈에 정리한 연습 자료</p></header>
<div class="toolbar"><input id="search" type="search" placeholder="답변 내용이나 키워드 검색" aria-label="답변 검색"><button onclick="window.print()">인쇄 / PDF 저장</button></div>
<nav class="filters" id="filters" aria-label="답변 분류"></nav><div class="count" id="count"></div><section class="cards" id="cards"></section><footer>원문 내용을 유지하고 맞춤법과 띄어쓰기, 중복 표현만 가볍게 다듬었습니다. 질문 제목은 내용에 맞춰 붙인 예시입니다.</footer></main>
<div class="reader-overlay" id="reader" hidden role="presentation"><section class="reader-panel" role="dialog" aria-modal="true" aria-labelledby="reader-title" tabindex="-1"><div class="reader-head"><span class="reader-label" id="reader-label"></span><button class="reader-close" id="reader-close" aria-label="확대 화면 닫기">✕</button></div><div class="reader-content" id="reader-scroll"><h2 id="reader-title"></h2><p class="reader-answer" id="reader-answer"></p></div><div class="reader-actions"><button id="reader-prev">← 이전</button><button id="reader-next">다음 →</button><span class="reader-grow"></span><button id="reader-smaller" aria-label="글씨 작게">가−</button><button id="reader-larger" aria-label="글씨 크게">가+</button><button class="reader-primary" id="reader-copy">답변 복사</button></div></section></div>
<script>
const items=[
[1,'책임감을 배운 경험','경험',`초등학교 시절 댄스 동아리를 했던 적이 있습니다. 당시 학교 무대에 설 일이 있었는데, 안무를 외우지 못해 옆 친구를 보며 겨우 따라 추면서 무대를 마친 경험이 있습니다. 무대를 마친 후 저는 오랜 기간 정성 들여 무대를 준비한 친구들과 선생님께 너무 죄송한 마음이 들어 사과를 드렸고, 이 경험을 통해 맡은 일에 책임감을 가져야 한다는 것을 배웠습니다.`],
[2,'자발적으로 나서서 도운 경험','경험',`고3 때 반 축제로 귀신의 집 부스를 운영했습니다. 축제가 끝나고 나니 장식을 떼고 정리하는 뒷정리가 남았는데, 모두가 피곤한 상태라 선뜻 하고 싶어 하지 않는 일이었습니다. 그 상황에서 저는 제가 먼저 하겠다고 나서서 정리를 도왔습니다. 다 마치고 공간을 깔끔하게 마무리하고 도움이 되었다는 생각에 뿌듯함을 느꼈습니다.`],
[3,'새로운 환경에 적응한 경험','경험',`초등학교 때 전학을 가서 아는 친구가 한 명도 없었습니다. 처음에는 어색했지만, 저는 가만히 기다리기보다 먼저 말을 걸어야겠다고 생각했습니다. 그래서 옆자리 친구에게 먼저 다가가 색연필을 빌려주며 말을 걸었고, 그 계기로 친해지며 새로운 학교에 적응할 수 있었습니다. 이 경험을 통해 먼저 다가가는 작은 행동이 관계의 시작이 된다는 걸 알게 됐습니다.`],
[4,'생각이 다른 사람과 소통하는 방법','가치관',`저는 모든 사람의 생각이 저와 같을 수 없다는 점을 알고 있습니다. 그렇기 때문에 저와 생각이 다른 상대를 만났을 때, 틀렸다고 판단하기보다 먼저 상대의 생각을 인정하고 그렇게 생각하는 이유를 끝까지 들어보겠습니다. 그다음에 제 의견을 상대를 존중하는 말투로, 근거를 들어 차분하게 전달하겠습니다. 만약 상대의 말이 더 타당하다고 생각된다면 제 생각을 바꿀 수 있는 열린 마음을 가지며, 필요하다면 서로의 의견을 합친 절충안도 제안하겠습니다. 서로 다른 생각을 존중하며 소통할 때 팀이 더 좋은 결과를 낼 수 있다고 믿습니다.`],
[5,'도전하는 태도가 중요한 이유','가치관',`저는 도전하는 태도가 더 중요하다고 생각합니다. 벽에 부딪혔을 때 도전하지 않으면 제자리걸음일 뿐이라고 생각하기 때문입니다. 모둠 활동을 하면서 누군가는 발표를 해야 했습니다. 팀원 모두가 발표하기 싫어하는 상황이었고, 저 또한 하고 싶지 않았습니다. 하지만 피하기만 하면 계속 같은 자리에 머물 것 같아서 제가 직접 해보겠다고 나섰습니다. 그 경험으로 하기 싫은 일도 한 번 부딪혀 보면 성장할 수 있다는 걸 배웠습니다. 지금 이렇게 면접을 보는 것도 저에게는 하나의 도전이라고 생각합니다. 다만 무작정 도전하기보다 충분히 준비하고 나서는 신중함도 함께 갖추려고 합니다.`],
[6,'뷰티 분야의 최근 이슈','전공',`저희 학과와 관련된 이슈는 전 세계적으로 K-뷰티가 큰 주목을 받으며, 단순한 유행을 넘어 하나의 독보적인 문화로 자리 잡았다는 것입니다. 저는 이러한 변화가 뷰티 분야의 더욱 큰 발전 가능성을 보여준다고 생각합니다.`],
[7,'존경하는 인물에게 하고 싶은 질문','전공',`제가 존경하는 인물인 오드리 헵번님이 제 멘토가 되어주신다면 드리고 싶은 질문은 “수십 년이 지난 지금까지도 전 세계의 독보적인 아이콘으로 기억되는 것처럼, 시간이 지나도 바래지 않는 나만의 시그니처 감각을 완성하고 지켜내기 위해 가장 필요한 태도는 무엇인가요?”입니다. 제가 이 질문을 드리고 싶은 이유는 저 역시 뷰티디자인과에서 공부하며 단순한 기술 습득을 넘어, 시간이 지나도 빛을 잃지 않는 나만의 시그니처 감각과 프로페셔널한 역량을 키우고 싶기 때문입니다.`],
[8,'뷰티디자인과 지원 동기','전공',`저는 어릴 때부터 뷰티에 관심이 많았습니다. 중학교 1학년 때 동아리에서 메이크업을 처음 제대로 배워보고, 고등학교 1학년 때는 처음 네일아트를 해보면서 직접 색을 고르고 꾸미는 과정이 즐겁다는 걸 느끼게 되었습니다. 그러면서 뷰티를 제대로 배우고 싶다는 마음이 점점 커져 이 학과에 지원하게 되었습니다.`],
[9,'가장 흥미로웠던 교과목','전공',`고등학교에서 배운 과목 중 가장 흥미로웠던 과목은 미술입니다. 고등학교 1학년 때 진행했던 ‘자화상 그리기’ 활동이 가장 기억에 남습니다. 거울을 통해 제 얼굴의 이목구비와 표정을 관찰하고, 스케치하고 색칠하는 과정이 마치 화장하는 것 같아 재미있었습니다. 제 얼굴의 장점과 고유한 분위기를 어떻게 하면 더 매력적으로 표현할 수 있을지 깊이 고민하며 흥미로운 시간이었다고 느꼈습니다.`],
[10,'나의 강점과 발전 방향','전공',`저의 강점은 미적 감각과 섬세함이라고 생각합니다. 뷰티 디자인 분야에서 미적 감각과 섬세함은 개인적으로 중요한 역량이라고 판단하고 있으며, 평소에는 집에서 네일아트와 그림을 그리는 것으로 꾸준히 저만의 감각을 길러왔습니다. 대학에서는 전공을 체계적으로 배워 미적 감각과 섬세함을 더 전문적으로 발전시키고 싶습니다.`],
[11,'도움 요청과 개인 일정이 겹칠 때','상황 대처',`저는 두 가지를 기준으로 판단하겠습니다. 첫째는 도움이 얼마나 급한 상황인지, 둘째는 제 일정을 놓쳤을 때 다른 분들께 미치는 영향입니다. 지금 바로 도움이 필요한 급한 상황이라면 제 일정보다 그분을 먼저 돕겠습니다. 반면 급하지 않은 상황이라면 주변에 도움을 줄 수 있는 분께 연결해 드리고, 저는 제 일정을 책임감 있게 지키겠습니다. 제가 일정을 놓치면 저뿐 아니라 함께하는 다른 분들께도 피해가 갈 수 있기 때문입니다. 이렇게 상황의 경중을 현명하게 판단해서, 도움이 필요한 분도 챙기고 맡은 책임도 끝까지 완수하는 균형 잡힌 태도를 갖추겠습니다.`],
[12,'팀 활동에 참여하지 않는 친구가 있다면','상황 대처',`우선 개인 사정이 있는지, 역할이 어렵거나 맞지 않는지 파악하는 것이 먼저라고 생각합니다. 이유를 알게 되면 그 친구가 잘할 수 있는 일로 역할을 조정하고, 팀원 모두가 참여할 수 있도록 일정과 역할을 다시 정리하겠습니다. 갈등보다 서로 소통하며 협력으로 과제를 마무리하는 것이 가장 중요하다고 생각합니다.`],
[13,'수업과 개인 일정이 겹칠 때','상황 대처',`저는 수업을 우선하겠습니다. 개인 일정은 조율이 가능할 수 있기에 일정 조정이 어려운 수업을 우선하겠습니다. 만약 일정을 조율하지 못할 정도로 중요한 개인 일정이라면 교수님께 사정을 설명드리고 양해를 구하겠습니다. 결석한 수업의 내용은 도움을 받아 자료를 구해 스스로 공부하여 반드시 보완하겠습니다.`],
[14,'AI의 과제 평가가 낮게 나왔을 때','상황 대처',`먼저 감정적으로 반응하기보다 평가 기준이 무엇이었는지 확인하겠습니다. 그 기준에 맞춰 제 과제를 다시 객관적으로 점검하고, 부족한 부분이 있다면 보완해서 다음에 반영하겠습니다. 만약 평가가 기준과 맞지 않는다고 판단되면 근거를 정리해서 교수님께 정중하게 문의드리겠습니다. 저는 AI 평가를 참고 자료로 활용하되, 최종 판단은 사람과 함께 확인하는 것이 공정하다고 생각합니다. 낮은 평가도 제 작품을 발전시킬 기회로 삼겠습니다.`],
[15,'여러 과제가 한꺼번에 몰렸을 때','경험',`고등학교 때 여러 과목의 수행평가가 한꺼번에 몰렸던 적이 있습니다. 저는 마감일이 가까운 과제부터 우선순위를 정해 차례대로 해결했고, 이 경험으로 일이 겹칠 때는 순서를 정하는 것이 중요하다는 것을 다시 한번 느꼈습니다.`]
];
const categories=['전체','경험','가치관','전공','상황 대처'];let current='전체';const cards=document.getElementById('cards'),search=document.getElementById('search'),filters=document.getElementById('filters');
function render(){const q=search.value.trim().toLowerCase();const shown=items.filter(x=>(current==='전체'||x[2]===current)&&[x[1],x[2],x[3]].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=`총 ${items.length}개 중 ${shown.length}개 답변 표시`;cards.replaceChildren();for(const x of shown){const card=document.createElement('article');card.className='card';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',`${x[0]}번 ${x[1]} 확대해서 읽기`);card.addEventListener('click',e=>{if(e.target.closest('.copy'))return;openReader(x[0])});card.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){e.preventDefault();openReader(x[0])}});const top=document.createElement('div');top.className='card-top';const num=document.createElement('span');num.className='number';num.textContent=`QUESTION ${String(x[0]).padStart(2,'0')}`;const tag=document.createElement('span');tag.className='tag';tag.textContent=x[2];top.append(num,tag);const title=document.createElement('h2');title.textContent=x[1];const answer=document.createElement('p');answer.className='answer';answer.textContent=x[3];const copy=document.createElement('button');copy.className='copy';copy.textContent='답변 복사';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(x[3]);copy.textContent='복사 완료';setTimeout(()=>copy.textContent='답변 복사',1300)}catch{copy.textContent='복사 불가'}});card.append(top,title,answer,copy);cards.append(card)}if(!shown.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='검색 결과가 없습니다.';cards.append(empty)}}
for(const cat of categories){const b=document.createElement('button');b.textContent=cat;b.className=cat===current?'active':'';b.addEventListener('click',()=>{current=cat;for(const btn of filters.children)btn.classList.toggle('active',btn.textContent===cat);render()});filters.append(b)}search.addEventListener('input',render);render();
const reader=document.getElementById('reader'),readerScroll=document.getElementById('reader-scroll');let selected=0,lastFocus=null,readerSize=21;
function visibleItems(){const q=search.value.trim().toLowerCase();return items.filter(x=>(current==='전체'||x[2]===current)&&[x[1],x[2],x[3]].join(' ').toLowerCase().includes(q))}
function fillReader(){const x=items.find(v=>v[0]===selected);if(!x)return;document.getElementById('reader-label').textContent=`QUESTION ${String(x[0]).padStart(2,'0')} · ${x[2]}`;document.getElementById('reader-title').textContent=x[1];document.getElementById('reader-answer').textContent=x[3];readerScroll.scrollTop=0;const list=visibleItems(),idx=list.findIndex(v=>v[0]===selected);document.getElementById('reader-prev').disabled=idx<=0;document.getElementById('reader-next').disabled=idx<0||idx===list.length-1}
function openReader(id){lastFocus=document.activeElement;selected=id;reader.hidden=false;document.body.classList.add('reader-open');fillReader();document.getElementById('reader-close').focus()}
function closeReader(){reader.hidden=true;document.body.classList.remove('reader-open');if(lastFocus?.isConnected)lastFocus.focus()}
function moveReader(dir){const list=visibleItems(),idx=list.findIndex(x=>x[0]===selected);if(list[idx+dir]){selected=list[idx+dir][0];fillReader()}}
document.getElementById('reader-close').addEventListener('click',closeReader);
reader.addEventListener('click',e=>{if(e.target===reader)closeReader()});
document.getElementById('reader-prev').addEventListener('click',()=>moveReader(-1));document.getElementById('reader-next').addEventListener('click',()=>moveReader(1));
function setReaderSize(delta){readerSize=Math.max(16,Math.min(32,readerSize+delta));document.getElementById('reader-answer').style.setProperty('--reader-size',readerSize+'px')}
document.getElementById('reader-smaller').addEventListener('click',()=>setReaderSize(-2));document.getElementById('reader-larger').addEventListener('click',()=>setReaderSize(2));
document.getElementById('reader-copy').addEventListener('click',async()=>{const b=document.getElementById('reader-copy');try{await navigator.clipboard.writeText(items.find(x=>x[0]===selected)[3]);b.textContent='복사 완료';setTimeout(()=>b.textContent='답변 복사',1300)}catch{b.textContent='복사 불가'}});
document.addEventListener('keydown',e=>{if(reader.hidden)return;if(e.key==='Escape')closeReader();else if(e.key==='ArrowLeft')moveReader(-1);else if(e.key==='ArrowRight')moveReader(1);else if(e.key==='Tab'){const focusable=[...reader.querySelectorAll('button:not(:disabled)')];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
</script></body></html>
